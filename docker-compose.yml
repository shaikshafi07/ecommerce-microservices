name: ecommerce-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      # Consumed by infra/postgres/init/01-create-service-databases.sh
      USER_DB_USERNAME: ${USER_DB_USERNAME:?Set USER_DB_USERNAME in .env}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      PRODUCT_DB_USERNAME: ${PRODUCT_DB_USERNAME:?Set PRODUCT_DB_USERNAME in .env}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?Set PRODUCT_DB_PASSWORD in .env}
      ORDER_DB_USERNAME: ${ORDER_DB_USERNAME:?Set ORDER_DB_USERNAME in .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
    ports:
      # Bound to localhost only, so the database is not exposed on your network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # pgAdmin: a browser UI for PostgreSQL. Opt-in, so it only runs when you ask for it:
  #   docker compose --profile tools up -d pgadmin
  # Then open http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecommerce-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      # Skips the master-password prompt; fine for a local development tool.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      # Keeps your registered servers and preferences between restarts.
      - pgadmin-data:/var/lib/pgadmin

  # Application containers are opt-in: docker compose --profile apps up --build
  #
  # On a completely fresh checkout the ./keys directory does not exist yet, and
  # product-service and order-service refuse to start without a public key. Run
  # user-service once first so it generates the pair:
  #   docker compose --profile apps up --build user-service
  # then bring up the rest.

  user-service:
    build: ./user-service
    image: ${ECR_REGISTRY}/user-service:${IMAGE_TAG}
    profiles: ["apps"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_DB_URL: jdbc:postgresql://postgres:5432/ecommerce_user_db
      USER_DB_USERNAME: ${USER_DB_USERNAME}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      JWT_KEY_DIR: /keys
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-15}
    volumes:
      # Read-write: this is the only service that may hold a private key, and it
      # generates the pair here on first run.
      - ./keys:/keys
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  product-service:
    build: ./product-service
    image: ${ECR_REGISTRY}/product-service:${IMAGE_TAG}
    profiles: ["apps"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PRODUCT_DB_URL: jdbc:postgresql://postgres:5432/ecommerce_product_db
      PRODUCT_DB_USERNAME: ${PRODUCT_DB_USERNAME}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
    volumes:
      # Read-only. Mounting just jwt-public.pem would be stricter still, but a
      # single-file bind mount fails if the file does not exist yet, and on a
      # fresh checkout it does not. See the note under "apps" below.
      - ./keys:/keys:ro
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  order-service:
    build: ./order-service
    image: ${ECR_REGISTRY}/order-service:${IMAGE_TAG}
    profiles: ["apps"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/ecommerce_order_db
      ORDER_DB_USERNAME: ${ORDER_DB_USERNAME}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      # Inside the Compose network, services are reachable by their service name.
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
    volumes:
      # Read-only, same reasoning as product-service.
      - ./keys:/keys:ro
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
      
  nginx:
    image: nginx:1.27-alpine
    container_name: ecommerce-nginx
    profiles: ["apps"]
    restart: unless-stopped
    depends_on:
      - user-service
      - product-service
      - order-service
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres-data:
  pgadmin-data:
